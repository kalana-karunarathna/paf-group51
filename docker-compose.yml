services:
  postgres:
    image: postgres:16
    container_name: smart-campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcampus}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - smart-campus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smart-campus

  backend:
    build:
      context: ./backend
    container_name: smart-campus-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartcampus}
      DB_USERNAME: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
      DDL_AUTO: update
      SHOW_SQL: "true"
      FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT:-3000}
    ports:
      - "${BACKEND_HOST_PORT:-8085}:8080"
    volumes:
      - smart-campus-backend-uploads:/app/uploads
    networks:
      - smart-campus

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: smart-campus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smart-campus

networks:
  smart-campus:
    driver: bridge

volumes:
  smart-campus-postgres-data:
  smart-campus-backend-uploads:
